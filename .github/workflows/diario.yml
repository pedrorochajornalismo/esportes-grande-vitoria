name: Coleta diária de notícias de esporte

on:
  schedule:
    # 17:00 UTC = 14:00 no horário de Brasília
    - cron: "0 17 * * *"
  workflow_dispatch:   # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar a coleta
        run: python coletor.py

      - name: Salvar resultado no repositório
        run: |
          git config user.name "coletor-esportes"
          git config user.email "coletor-esportes@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
          else
            git commit -m "Atualização diária de notícias de esporte"
            git push
          fi
